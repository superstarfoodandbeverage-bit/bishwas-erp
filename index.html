<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bishwas ERP</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#1457c5;color:#fff;padding:18px;font-size:24px;font-weight:bold}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}button{padding:12px;border:0;border-radius:9px;background:#1457c5;color:#fff;font-weight:bold;margin:4px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd2da;border-radius:8px;margin:5px 0 10px}label{font-weight:bold;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<div class="top">Bishwas ERP</div><div class="wrap">
<div class="card"><h2>Delivery / Invoice</h2>
<label>Dealer Name</label><input id="dealer" placeholder="যেমন: Rahman Traders">
<label>Dealer Mobile</label><input id="phone" placeholder="01XXXXXXXXX">
<label>Invoice / Challan No.</label><input id="invoice" placeholder="INV-1001">
<label>Product</label><input id="product" placeholder="Sun Detergent 500g">
<label>Quantity</label><input id="qty" type="number" placeholder="20">
<label>Unit</label><input id="unit" value="বস্তা">
<label>Total Price</label><input id="amount" type="number" placeholder="25000">
<label>Previous Balance</label><input id="oldbal" type="number" value="0">
<label>Payment Received</label><input id="payment" type="number" value="0">
<div class="row"><button onclick="saveDelivery()">💾 SAVE DELIVERY</button><button onclick="sendSMS()">📱 SEND SMS</button></div>
<label>SMS Preview</label><textarea id="preview" readonly rows="9"></textarea>
</div>
<div class="card"><h3>SMS Format</h3><p>Bishwas ERP<br>প্রিয় [পার্টির নাম],<br>আপনার অর্ডার সফলভাবে ডেলিভারি হয়েছে।<br>পণ্য: [পণ্য] – [পরিমাণ] [ইউনিট]<br>মোট মূল্য: ৳[মোট মূল্য]<br>বাকি: ৳[বাকি]<br>চালান নং: [চালান]<br>ধন্যবাদ।</p></div>
</div>
<script>
function makeSMS(){
let d=dealer.value||"পার্টি",p=product.value||"",q=qty.value||0,u=unit.value||"pcs",a=Number(amount.value||0),o=Number(oldbal.value||0),pay=Number(payment.value||0),b=o+a-pay;
return `Bishwas ERP
প্রিয় ${d},
আপনার অর্ডার সফলভাবে ডেলিভারি হয়েছে।
পণ্য: ${p} – ${q} ${u}
মোট মূল্য: ৳${a.toLocaleString("en-BD")}
বাকি: ৳${b.toLocaleString("en-BD")}
চালান নং: ${invoice.value||"N/A"}
ধন্যবাদ।`;
}
function saveDelivery(){preview.value=makeSMS();alert("Delivery saved. SMS Preview তৈরি হয়েছে।");}
function sendSMS(){
let msg=makeSMS();preview.value=msg;
if(!phone.value){alert("Dealer Mobile Number দিন।");return}
location.href="sms:"+phone.value+"?body="+encodeURIComponent(msg);
}
</script></html>
