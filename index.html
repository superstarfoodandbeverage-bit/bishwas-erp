<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">Sun Factory Dashboard</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium">বিক্রি (Total Sales)</label>
                <input type="number" id="salesInput" class="w-full border p-2 rounded" placeholder="টাকা লিখুন">
            </div>
            <div>
                <label class="block text-sm font-medium">বকেয়া (Total Due)</label>
                <input type="number" id="dueInput" class="w-full border p-2 rounded" placeholder="টাকা লিখুন">
            </div>
            <button onclick="saveData()" class="w-full bg-blue-600 text-white py-2 rounded font-semibold">ডাটা সেভ করুন</button>
        </div>

        <hr class="my-6">

        <div class="space-y-3">
            <div class="bg-blue-50 p-3 rounded flex justify-between">
                <span>💰 Total Sales:</span>
                <strong id="displaySales">৳0</strong>
            </div>
            <div class="bg-red-50 p-3 rounded flex justify-between">
                <span>📌 Total Due:</span>
                <strong id="displayDue">৳0</strong>
            </div>
        </div>
    </div>

    <script>
        // আপনার Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AiZaSyAtMGCmHjnEFOBnqMAbcHqKxCggFJMNl6I",
            authDomain: "sun-factory-fb344.firebaseapp.com",
            projectId: "sun-factory-fb344",
            storageBucket: "sun-factory-fb344.firebasestorage.app",
            messagingSenderId: "10478798272",
            appId: "1:10478798272:web:445addc7205fe7c8ef7425",
            measurementId: "G-HCPRYCLRDZ",
            databaseURL: "https://sun-factory-fb344-default-rtdb.firebaseio.com"
        };

        // Firebase ইনিশিয়ালাইজ করা
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ডাটা সেভ করার ফাংশন
        function saveData() {
            const sales = document.getElementById('salesInput').value || 0;
            const due = document.getElementById('dueInput').value || 0;

            database.ref('dashboard').set({
                sales: sales,
                due: due
            });
            alert("ডাটা আপডেট হয়েছে!");
        }

        // ডাটা রিয়েল-টাইমে দেখার ফাংশন
        database.ref('dashboard').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('displaySales').innerText = '৳' + (data.sales || 0);
                document.getElementById('displayDue').innerText = '৳' + (data.due || 0);
            }
        });
    </script>
</body>
</html>
